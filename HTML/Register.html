<html>

<head>
    <meta charset="utf-8" />
    <title>Register</title>
</head>

<body>
    <h1>Create your account</h1>
    <form method="POST">
        <label for="first_name">First Name</label>
        <input type="text" name="first_name" required>

        <label>Last Name</label>
        <input type="text" name="last_name" required> <br><br>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Mobile Number</label>
        <input type="tel" name="mobile_numer" required><br><br>

        <label>Gender</label>

        <input type="radio" name="gender" value="Male">
        <label>Male</label>

        <input type="radio" name="gender" value="Female">
        <label>Female</label>

        <input type="radio" name="gender" value="Other">
        <label>Other</label>

        <label>Date of Birth</label>
        <input type="date" name="date_of_birth" required> <br><br>

        <label>Course</label>

        <select name="course">
            <option value="" selected disabled>Select Course</option>
            <option>B.Tech CSE</option>
            <option>B.Tech CE</option>
            <option>B.Tech IT</option>
            <option>B.Tech MECH</option>
            <option>B.Tech CIVIL</option>
            <option>B.Tech ELEC</option>
            <option>BCA</option>
            <option>BBA</option>

        </select>
        <label>Student Id</label>
        <input type="number" name="student_id" required> <br><br>

        <label>Password</label>
        <input type="password" name="password" required>

        <label>Confirm Password</label>
        <input type="password" name="confirm_password" required> <br><br>


        <button type="submit">Register</button>

    </form>

    <footer>
        <p>&copy; 2026 StudentHub</p>
    </footer>
</body>

</html>
